    <script>
        let currentSlide = 1;
        const totalSlides = 6;
        
        function initDots() {
            const dotsContainer = document.getElementById('slide-dots');
            for (let i = 1; i <= totalSlides; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === 1 ? ' active' : '');
                dot.onclick = () => goToSlide(i);
                dotsContainer.appendChild(dot);
            }
        }
        
        function updateUI() {
            // Update counter
            document.getElementById('current-slide').textContent = currentSlide;
            
            // Update dots
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i + 1 === currentSlide);
            });
            
            // Update slides
            document.querySelectorAll('.slide').forEach((slide, i) => {
                slide.classList.toggle('active', i + 1 === currentSlide);
            });
            
            // Update buttons
            document.getElementById('prev-btn').disabled = currentSlide === 1;
            document.getElementById('next-btn').disabled = currentSlide === totalSlides;
        }
        
        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                updateUI();
            }
        }
        
        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                updateUI();
            }
        }
        
        function goToSlide(n) {
            currentSlide = n;
            updateUI();
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
        
        // Initialize
        initDots();
        updateUI();
    </script>
